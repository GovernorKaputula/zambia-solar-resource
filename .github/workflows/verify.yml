name: Verify solar study
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m src.analysis
      - run: python -m unittest discover -s tests -v
      - run: python scripts/sql_audit.py
      - run: python build.py
      - run: python scripts/check_site.py docs
      - uses: actions/upload-artifact@v4
        with:
          name: verified-solar-study
          path: |
            reports/
            docs/
